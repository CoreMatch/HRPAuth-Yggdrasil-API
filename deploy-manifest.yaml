# HRPAuth-Yggdrasil-API 部署声明（deploy-manifest v1）
# schema 依据：HA-Services-Deployer internal/manifest/（SchemaVersion=1）
manifest_version: 1
kind: service
project: hrpauth-yggdrasil-api
display_name: HRPAuth-Yggdrasil-API
group: satellite
# 模板 site.version / yggdrasil.server.version 均为 "1.0.0"（无 git 版本 tag）。
service_version: "1.0.0"

facts:
  ports:
    # deploy/config/hrpauth-yggdrasil-api.yaml.tmpl: server.port :2770；
    # compose 默认对外映射（游戏客户端走 Yggdrasil 协议）。
    - name: http
      port: 2770
      exposure: public
  health:
    # main.go r.GET("/health")；compose healthcheck 同路径
    http:
      port_name: http
      path: /health
      expect_status: 200
      timeout_seconds: 5
      interval_seconds: 30
      retries: 3
  smoke:
    # 部署后冒烟：profile 查询链路真的活着。用全零 UUID 查一个
    # 必然不存在的档案——查询走到数据库并正确返回 404
    # ProfileNotFoundException（controllers/yggdrasil_controller.go
    # ProfileQuery；knowledge/0010），无需真实玩家数据与凭据。
    # 断言的是"确定性的正确响应"，不是再查一次活没活着。
    - name: profile-query-miss
      method: GET
      path: /sessionserver/session/minecraft/profile/00000000-0000-0000-0000-000000000000
      expect_status: 404
      timeout_seconds: 10
      assert:
        contains: ProfileNotFoundException
  depends_on:
    # database/redis 段为启动硬依赖；core_api 指向 HRPAuth：
    # 启动期凭据解析（main.go resolveCoreCredentials）+ FetchMetadata，
    # compose depends_on hrpauth: service_healthy。
    - project: mysql
      kind: required
    - project: redis
      kind: required
    - project: hrpauth
      kind: required
  migration:
    # main.go EnsureMigrations（失败即 fatal）；配置启动期自动迁移（config/migrations.go）。
    mode: auto_on_startup
  data_dirs:
    # 模板 yggdrasil.security.textures_storage: ./storage（布局 {textures,previews}，
    # 与 haskinlib 共享同一份纹理存储，见 compose volumes.haskin-textures 注释）。
    - ./storage
  config:
    # controllers/startup_controller.go ConfigFileName="config.yaml"；
    # 模板版本 = 模板首行 version: "4"（代码 config.ConfigVersion 同为 "4"）。
    - path: config.yaml
      template_version: "4"
  static_assets: ""

baremetal:
  process:
    manager: aapanel
  install:
    # PROD-FILEREFRESH-20261107 §1：二进制在位路径 /www/wwwroot/hay/HAygg
    root: /www/wwwroot/hay
    binary_name: HAygg
  artifact:
    source: local_path
    local_path: build/HAygg

container:
  enabled: false
  # 容器形态镜像：已真实发布（Docker Hub，build → push → 回拉 → 挂回
  # compose 平台冒烟全过）。镜像为 linux/amd64 + linux/arm64 多架构
  # manifest list，digest 钉的是 manifest list 摘要（非单平台子摘要），
  # 为生效引用，tag 仅可读别名。
  # 部署时 Deployer 按 digest 优先真实拉取本镜像（鉴权沿用宿主 docker 登录态；拉后摘要对照不符即响亮失败）。
  image:
    source: registry
    repo: limeight/ha-hrpauth-yggdrasil-api
    tag: "1.0.0-7ab0d29"
    digest: "sha256:9c78eddf66dd493aa2cdd77193ba52e5e85fcb378edeec45d0425e5a551c2f59"
